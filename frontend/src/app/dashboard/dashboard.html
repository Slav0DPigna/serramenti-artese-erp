<div class="glass-panel">
  <h2>Dashboard Aziendale</h2>
  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
    <div class="glass-panel" style="flex: 1; text-align: center;">
      <h3>Prodotti</h3>
      <div style="font-size: 2rem; color: var(--accent);">{{stats.prodotti}}</div>
    </div>
    <div class="glass-panel" style="flex: 1; text-align: center;">
      <h3>Ordini in Elaborazione</h3>
      <div style="font-size: 2rem; color: var(--accent);">{{stats.ordini}}</div>
    </div>
    <div class="glass-panel" style="flex: 1; text-align: center;">
      <h3>Dipendenti</h3>
      <div style="font-size: 2rem; color: var(--accent);">{{stats.dipendenti}}</div>
    </div>
  </div>
</div>
