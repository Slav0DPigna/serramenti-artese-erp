<nav class="header-nav">
  <div class="brand">Serramenti Artese</div>
  
  <ng-container>
    <a routerLink="/catalogo" routerLinkActive="active">Catalogo Prodotti</a>
  </ng-container>

  <ng-container *ngIf="isLoggedIn">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/ordini" routerLinkActive="active" *ngIf="isDirettore || isAddettoVendite || isMagazziniere || isAddettoProduzione || isCliente">Ordini Clienti</a>
    <a routerLink="/magazzino" routerLinkActive="active" *ngIf="isDirettore || isMagazziniere || isAddettoProduzione">Magazzino</a>
    <a routerLink="/risorse-umane" routerLinkActive="active" *ngIf="isDirettore || isAddettoVendite || isMagazziniere || isAddettoProduzione">Risorse Umane (Ferie & Permessi)</a>
  </ng-container>

  <div style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
    <ng-container *ngIf="isLoggedIn">
      <span style="color: var(--text-secondary)">Ciao, {{username}}</span>
      <button class="btn" style="background: var(--danger)" (click)="logout()">Logout</button>
    </ng-container>
    <ng-container *ngIf="!isLoggedIn">
      <button class="login-mega-btn" (click)="login()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6zm5.8-2h-2v-2h2v-2h-2V7h2v6z" opacity="0"/>
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
        </svg>
        Accedi all'Area Riservata
      </button>
    </ng-container>
  </div>
</nav>

<main class="container">
  <router-outlet></router-outlet>
</main>
