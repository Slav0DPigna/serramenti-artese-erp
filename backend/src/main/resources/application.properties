spring.datasource.url=jdbc:sqlite:serramenti_artese.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework.web=DEBUG

# Show SQL queries
spring.jpa.show-sql=true

# Initial schema script for triggers
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.separator=;;

# Keycloak Security Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/serramenti-artese
